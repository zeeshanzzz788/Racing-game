name: Android build

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android player
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildMethod: VelocityRush.EditorTools.AndroidBuild.Build
          buildName: VelocityRush
          buildsPath: build/Android
          androidExportType: androidPackage
          customParameters: '-buildPath build/Android/VelocityRush.apk'
          allowDirtyBuild: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: velocity-rush-android
          path: build/Android/VelocityRush.apk
          if-no-files-found: error
          retention-days: 14
