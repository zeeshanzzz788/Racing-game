name: Android build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      build_name:
        description: 'APK base name'
        required: false
        default: 'VelocityRush'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-license:
    name: Check Unity license secrets
    runs-on: ubuntu-22.04
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          # secrets are not directly testable for emptiness in all contexts; use length via shell
          U_LIC: ${{ secrets.UNITY_LICENSE }}
          U_EMAIL: ${{ secrets.UNITY_EMAIL }}
          U_PASS: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$U_LIC" ] && [ -n "$U_EMAIL" ] && [ -n "$U_PASS" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
            echo "Unity credentials present (LICENSE + EMAIL + PASSWORD)."
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Need secrets UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD. See Docs/GITHUB_APK_BUILD.md or run workflow 'Request Unity activation file'."
          fi

  build:
    name: Build Velocity Rush APK
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: VelocityRush.EditorTools.AndroidBuild.Build
          buildName: ${{ github.event.inputs.build_name || 'VelocityRush' }}
          buildsPath: build/Android
          androidExportType: androidPackage
          customParameters: '-buildPath build/Android/VelocityRush.apk'
          allowDirtyBuild: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: velocity-rush-android
          path: |
            build/Android/**/*.apk
            build/Android/VelocityRush.apk
          if-no-files-found: error
          retention-days: 30

  missing-license:
    name: License required
    needs: check-license
    if: needs.check-license.outputs.has_license == 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: How to enable Unity Android builds
        run: |
          cat <<'EOF'
          ============================================================
          Velocity Rush — configure Unity secrets, then rebuild
          ============================================================

          FULL GAME is already in this repo. CI will generate all scenes
          (menu, garage, 5 circuits, endless, 6 cars, upgrades, AI…) and
          output VelocityRush.apk.

          1) Unity Hub → Preferences → Licenses → Add → free Personal
          2) Open Unity_lic.ulf:
               Windows: C:\ProgramData\Unity\Unity_lic.ulf
               macOS:   /Library/Application Support/Unity/Unity_lic.ulf
               Linux:   ~/.local/share/unity3d/Unity/Unity_lic.ulf
          3) GitHub repo Secrets (Actions):
               UNITY_LICENSE   = file contents
               UNITY_EMAIL     = Unity login email
               UNITY_PASSWORD  = Unity login password
          4) Re-run workflow "Android build"
          5) Download artifact "velocity-rush-android"

          Docs: Docs/GITHUB_APK_BUILD.md
          game.ci: https://game.ci/docs/github/activation
          ============================================================
          EOF
          exit 1
